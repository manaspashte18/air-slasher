<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>🍉 Air Slasher — Fingertip Katana v2.4</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    #version-badge {
      position: fixed;
      bottom: 8px;
      right: 12px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      font-family: monospace;
      letter-spacing: 0.5px;
      pointer-events: none;
      z-index: 100;
      background: rgba(0, 0, 0, 0.35);
      padding: 3px 8px;
      border-radius: 4px;
    }

    body {
      background: #0a0a0f;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      height: 100vh;
      width: 100vw;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }

    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 15;
      pointer-events: none;
    }

    /* ── HUD ── */
    #hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 18px 28px;
      pointer-events: none;
    }

    .hud-box {
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 10px 22px;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .hud-box .label {
      font-size: 11px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.6;
      margin-bottom: 2px;
    }

    #lives-display span {
      font-size: 24px;
      margin-right: 2px;
      filter: drop-shadow(0 0 4px crimson);
    }

    #combo-display {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      z-index: 4;
      font-size: 64px;
      font-weight: 900;
      color: #ffdd57;
      text-shadow: 0 0 30px rgba(255,200,0,0.7), 0 4px 15px rgba(0,0,0,0.5);
      pointer-events: none;
      opacity: 0;
      transition: none;
    }

    /* ── Overlays ── */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(5, 5, 15, 0.88);
      backdrop-filter: blur(18px);
      color: #fff;
      text-align: center;
      transition: opacity 0.4s;
    }

    .overlay.hidden { display: none; }

    .overlay h1 {
      font-size: 56px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 20px rgba(255,200,80,0.4));
    }

    .overlay .subtitle {
      font-size: 18px;
      opacity: 0.6;
      margin-bottom: 36px;
      max-width: 400px;
      line-height: 1.5;
    }

    .overlay button {
      pointer-events: auto;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      border: none;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      padding: 16px 52px;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 8px 30px rgba(255,65,108,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .overlay button:hover {
      transform: scale(1.06);
      box-shadow: 0 12px 40px rgba(255,65,108,0.6);
    }

    #game-over-overlay .final-score {
      font-size: 72px;
      font-weight: 900;
      color: #ffd93d;
      text-shadow: 0 0 40px rgba(255,200,0,0.5);
      margin: 10px 0;
    }

    #game-over-overlay .stats {
      font-size: 16px;
      opacity: 0.5;
      margin-bottom: 30px;
    }

    #game-over-overlay {
      background: rgba(5, 5, 15, 0.65);
      backdrop-filter: blur(10px);
    }

    .gesture-hint {
      margin-top: 16px;
      font-size: 16px;
      font-weight: 600;
      color: #ffd93d;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      animation: pulseHint 2s infinite ease-in-out;
    }
    @keyframes pulseHint {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }

    /* Loading spinner */
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #ff416c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-text {
      font-size: 14px;
      opacity: 0.5;
    }
  </style>
</head>

<!-- MediaPipe Hands via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
// ════════════════════════════════════════════════
//  GAME CONFIG
// ════════════════════════════════════════════════
const CONFIG = {
  maxLives: 3,
  fruitSpawnInterval: 900,     // ms — gets faster over time
  minSpawnInterval: 400,
  fruitSpeed: { min: 7, max: 10 },
  bombChance: 0.12,            // 12 % chance a spawn is a bomb
  sliceRadius: 70,             // px — how close finger must be
  trailLength: 18,
  trailFadeSpeed: 0.06,
  comboWindow: 800,            // ms to chain combo slices
  difficultyRampSec: 120,      // seconds to reach max difficulty
};

// ════════════════════════════════════════════════
//  FRUIT DEFINITIONS  (emoji, color, juice-color)
// ════════════════════════════════════════════════
const FRUIT_TYPES = [
  { emoji: '🍉', color: '#ff6b6b', juice: '#e74c3c', name: 'Watermelon' },
  { emoji: '🍊', color: '#ffa502', juice: '#e67e22', name: 'Orange' },
  { emoji: '🍋', color: '#ffd93d', juice: '#f1c40f', name: 'Lemon' },
  { emoji: '🍎', color: '#ee5a24', juice: '#c0392b', name: 'Apple' },
  { emoji: '🥝', color: '#6bcb77', juice: '#27ae60', name: 'Kiwi' },
  { emoji: '🍇', color: '#a55eea', juice: '#8e44ad', name: 'Grape' },
  { emoji: '🍑', color: '#fd79a8', juice: '#e84393', name: 'Peach' },
  { emoji: '🫐', color: '#4d96ff', juice: '#2d3436', name: 'Blueberry' },
];

const BOMB = { emoji: '💣', color: '#2d3436', juice: '#636e72', name: 'Bomb' };

// ════════════════════════════════════════════════
//  DOM REFS
// ════════════════════════════════════════════════
const video       = document.getElementById('webcam');
const canvas      = document.getElementById('gameCanvas');
const ctx         = canvas.getContext('2d');
const hud         = document.getElementById('hud');
const scoreEl     = document.getElementById('score-display');
const bestEl      = document.getElementById('best-display');
const livesEl     = document.getElementById('lives-display');
const comboEl     = document.getElementById('combo-display');
const startOv     = document.getElementById('start-overlay');
const gameOverOv  = document.getElementById('game-over-overlay');
const startBtn    = document.getElementById('start-btn');
const restartBtn  = document.getElementById('restart-btn');
const finalScoreE = document.getElementById('final-score');
const finalStats  = document.getElementById('final-stats');
const loadSpinner = document.getElementById('load-spinner');
const loadingText = document.getElementById('loading-text');

// ════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════
let gameState = 'idle'; // idle | playing | over
let score = 0;
let bestScore = parseInt(localStorage.getItem('airslasher_best') || '0');
let lives = CONFIG.maxLives;
let fruits = [];
let slicedHalves = [];
let particles = [];
let comboCount = 0;
let lastSliceTime = 0;
let totalSliced = 0;
let totalMissed = 0;
let gameStartTime = 0;
let spawnTimer = 0;
let currentSpawnInterval = CONFIG.fruitSpawnInterval;
let holdToRestartTimer = 0;

// ── Web Audio Synthesizer (Instant SFX without external audio files) ──
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playSliceSound() {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(900 + Math.random() * 300, now);
    osc.frequency.exponentialRampToValueAtTime(120, now + 0.1);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.005, now + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.onended = () => {
      try { osc.disconnect(); gain.disconnect(); } catch (e) {}
    };
    osc.start(now);
    osc.stop(now + 0.11);
  } catch (e) {}
}

function playBombSound() {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.onended = () => {
      try { osc.disconnect(); gain.disconnect(); } catch (e) {}
    };
    osc.start(now);
    osc.stop(now + 0.36);
  } catch (e) {}
}

function playComboSound(count) {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    const base = 480 + Math.min(count * 90, 850);
    osc.frequency.setValueAtTime(base, now);
    osc.frequency.exponentialRampToValueAtTime(base * 1.4, now + 0.18);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.005, now + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.onended = () => {
      try { osc.disconnect(); gain.disconnect(); } catch (e) {}
    };
    osc.start(now);
    osc.stop(now + 0.21);
  } catch (e) {}
}

// ── Smooth Fingertip & Knife Tracking System ──
let playerHand = {
  active: false,
  targetX: -1,
  targetY: -1,
  targetAngle: 0,
  x: -1,
  y: -1,
  lastX: -1,
  lastY: -1,
  baseX: -1,
  baseY: -1,
  lastBaseX: -1,
  lastBaseY: -1,
  angle: 0,
  bladeLen: 110,
  gripLen: 50,
  trail: [],
  lastSeenTime: 0
};

bestEl.textContent = bestScore;

// ════════════════════════════════════════════════
//  CANVAS SIZING
// ════════════════════════════════════════════════
function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ════════════════════════════════════════════════
//  MEDIAPIPE HANDS SETUP (16:9 Native Widescreen)
// ════════════════════════════════════════════════
let handsReady = false;
let isProcessingFrame = false;
let handsInstance = null;
let cameraInstance = null;

function setupHands() {
  if (handsInstance) return handsInstance;

  const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
  });

  // Single-hand tracking: cuts model workload by ~50% for maximum 60fps tracking speed
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 0,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5,
  });

  hands.onResults(onHandResults);

  // 1280x720 matches native 16:9 webcam sensors, completely preventing camera zoom-in / cropping!
  const camera = new Camera(video, {
    onFrame: async () => {
      // FRAME-DROP GUARD: If the model is still processing the previous frame,
      // drop this frame immediately instead of queuing it up!
      if (isProcessingFrame) return;
      isProcessingFrame = true;
      try {
        await hands.send({ image: video });
      } catch (err) {
        console.error('Hands send error:', err);
      } finally {
        isProcessingFrame = false;
      }
    },
    width: 1280,
    height: 720,
  });

  camera.start().then(() => {
    handsReady = true;
    loadingText.textContent = 'Camera ready!';
  });

  handsInstance = hands;
  cameraInstance = camera;
  return hands;
}

function lerp(a, b, t) { return a + (b - a) * t; }

// Exact projection from webcam coordinate space to canvas matching CSS object-fit: cover
function mapLandmarkToCanvas(tip) {
  // tip.x is normalized [0, 1] relative to video width
  // Mirror horizontally because webcam display is mirrored (transform: scaleX(-1))
  const mirroredX = 1 - tip.x;
  const rawY = tip.y;

  const vw = video.videoWidth || 1280;
  const vh = video.videoHeight || 720;
  const cw = canvas.width;
  const ch = canvas.height;

  const videoAspect = vw / vh;
  const canvasAspect = cw / ch;

  let renderW, renderH, offsetX, offsetY;
  if (canvasAspect > videoAspect) {
    // Canvas is wider than video relative to height -> video width covers canvas, height overflows
    renderW = cw;
    renderH = cw / videoAspect;
    offsetX = 0;
    offsetY = (ch - renderH) / 2;
  } else {
    // Canvas is taller than video relative to width -> video height covers canvas, width overflows
    renderH = ch;
    renderW = ch * videoAspect;
    offsetX = (cw - renderW) / 2;
    offsetY = 0;
  }

  return {
    x: offsetX + mirroredX * renderW,
    y: offsetY + rawY * renderH
  };
}

// Smooth angle interpolation that handles wrapping around ±π
function lerpAngle(a, b, t) {
  let diff = b - a;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  return a + diff * t;
}

// ════════════════════════════════════════════════
//  KNIFE DRAWING (Katana Tip Aligned Directly at Index Fingertip)
// ════════════════════════════════════════════════
function drawKnife(ctx, tipX, tipY, angle, speed, bLen = 110, gLen = 50) {
  ctx.save();
  ctx.translate(tipX, tipY);
  ctx.rotate(angle);

  const bladeLen = bLen;
  const gripLen = gLen;
  const bladeW = Math.max(13, bladeLen * 0.14);
  const guardW = Math.max(34, bladeW * 2.5);
  const guardH = 8;
  const gripW = Math.max(10, bladeW * 0.72);

  // ── Blade glow (flares during fast slashes) ──
  const glowIntensity = Math.min(speed / 16, 1);
  if (glowIntensity > 0.05) {
    ctx.shadowColor = `rgba(255, 215, 0, ${0.45 + glowIntensity * 0.55})`;
    ctx.shadowBlur = 10 + glowIntensity * 24;
  }

  // ── Steel blade (sharp tip at (0, 0), runs down along finger to guard) ──
  const bladeGrad = ctx.createLinearGradient(-bladeW / 2, 0, bladeW / 2, 0);
  bladeGrad.addColorStop(0, '#64748b');
  bladeGrad.addColorStop(0.25, '#cbd5e1');
  bladeGrad.addColorStop(0.5, '#ffffff');
  bladeGrad.addColorStop(0.75, '#cbd5e1');
  bladeGrad.addColorStop(1, '#64748b');
  ctx.fillStyle = bladeGrad;

  ctx.beginPath();
  ctx.moveTo(0, 0); // Sharp needle tip locked at index fingertip!
  ctx.quadraticCurveTo(-bladeW * 0.65, bladeLen * 0.45, -bladeW * 0.5, bladeLen);
  ctx.lineTo(bladeW * 0.5, bladeLen);
  ctx.quadraticCurveTo(bladeW * 0.65, bladeLen * 0.45, 0, 0);
  ctx.closePath();
  ctx.fill();

  // ── Blade edge highlight (hamon wave line) ──
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.moveTo(0, 6);
  for (let by = 14; by < bladeLen - 6; by += 12) {
    const wave = Math.sin(by * 0.12) * 1.6;
    ctx.lineTo(-bladeW * 0.22 + wave, by);
  }
  ctx.stroke();

  // ── Central ridge line (shinogi) ──
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(0, 4);
  ctx.lineTo(0, bladeLen - 4);
  ctx.stroke();

  // ── Golden tsuba (guard) at the knuckle ──
  ctx.shadowBlur = 0;
  const tsubaY = bladeLen + 3;
  const tsubaGrad = ctx.createLinearGradient(-guardW / 2, tsubaY, guardW / 2, tsubaY);
  tsubaGrad.addColorStop(0, '#8B6914');
  tsubaGrad.addColorStop(0.3, '#ffd700');
  tsubaGrad.addColorStop(0.5, '#fff5c0');
  tsubaGrad.addColorStop(0.7, '#ffd700');
  tsubaGrad.addColorStop(1, '#8B6914');
  ctx.fillStyle = tsubaGrad;
  ctx.beginPath();
  ctx.ellipse(0, tsubaY, guardW / 2, guardH / 2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#5a3e05';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // Tsuba inner decorative ellipse
  ctx.strokeStyle = 'rgba(255,215,0,0.5)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.ellipse(0, tsubaY, guardW / 2 - 4, guardH / 2 - 1.5, 0, 0, Math.PI * 2);
  ctx.stroke();

  // ── Dark wrapped grip (tsuka) resting in palm ──
  const gripTop = tsubaY + 3;
  const gripGrad = ctx.createLinearGradient(-gripW / 2, 0, gripW / 2, 0);
  gripGrad.addColorStop(0, '#0d0d1a');
  gripGrad.addColorStop(0.3, '#2a2a44');
  gripGrad.addColorStop(0.7, '#2a2a44');
  gripGrad.addColorStop(1, '#0d0d1a');
  ctx.fillStyle = gripGrad;
  ctx.fillRect(-gripW / 2, gripTop, gripW, gripLen);

  // Golden diamond cord wrap
  ctx.strokeStyle = 'rgba(255,215,0,0.45)';
  ctx.lineWidth = 1.2;
  for (let gy = gripTop + 4; gy < gripTop + gripLen - 5; gy += 9) {
    ctx.beginPath();
    ctx.moveTo(-gripW / 2 + 1, gy);
    ctx.lineTo(0, gy + 4.5);
    ctx.lineTo(gripW / 2 - 1, gy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-gripW / 2 + 1, gy + 9);
    ctx.lineTo(0, gy + 4.5);
    ctx.lineTo(gripW / 2 - 1, gy + 9);
    ctx.stroke();
  }

  // ── Golden pommel (kashira) near wrist ──
  const pommelY = gripTop + gripLen + 2;
  ctx.fillStyle = '#daa520';
  ctx.beginPath();
  ctx.ellipse(0, pommelY, gripW / 2 + 2, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#6B4F0A';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // ── Knife Tip Glint & Sparkle at (0, 0) — LOCKED TO FINGERTIP ──
  const glintGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 10);
  glintGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
  glintGrad.addColorStop(0.35, 'rgba(255, 215, 0, 0.65)');
  glintGrad.addColorStop(1, 'rgba(255, 215, 0, 0)');
  ctx.fillStyle = glintGrad;
  ctx.fillRect(-10, -10, 20, 20);

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Dynamic 4-point star flare during swings
  if (speed > 3) {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-8, 0); ctx.lineTo(8, 0);
    ctx.moveTo(0, -8); ctx.lineTo(0, 8);
    ctx.stroke();
  }

  ctx.restore();
}

// ════════════════════════════════════════════════
//  HAND RESULTS — Index Fingertip Tracking & Finger Direction Angle
// ════════════════════════════════════════════════
function onHandResults(results) {
  const detected = results.multiHandLandmarks || [];
  if (detected.length === 0) {
    return;
  }

  const lm = detected[0];

  // Landmark 8: Index fingertip
  const indexTip = mapLandmarkToCanvas(lm[8]);
  // Landmark 6: Index PIP joint, Landmark 5: Index knuckle, Landmark 0: Wrist
  const pipPt = mapLandmarkToCanvas(lm[6]);
  const knucklePt = mapLandmarkToCanvas(lm[5]);
  const wristPt = mapLandmarkToCanvas(lm[0]);

  // Index finger pointing vector (from PIP/knuckle to fingertip)
  let dxH = indexTip.x - pipPt.x;
  let dyH = indexTip.y - pipPt.y;
  if (Math.hypot(dxH, dyH) < 12) {
    dxH = indexTip.x - knucklePt.x;
    dyH = indexTip.y - knucklePt.y;
  }
  if (Math.hypot(dxH, dyH) < 15) {
    dxH = knucklePt.x - wristPt.x;
    dyH = knucklePt.y - wristPt.y;
  }

  // Knife tip is at local (0, 0), blade extends along positive Y (towards knuckle).
  // Vector pointing along blade towards knuckle is (-dxH, -dyH).
  // Angle for rotation so blade points in finger direction:
  playerHand.targetAngle = Math.atan2(dxH, -dyH);

  // Directly track the index fingertip
  playerHand.targetX = indexTip.x;
  playerHand.targetY = indexTip.y;
  playerHand.active = true;
  playerHand.lastSeenTime = performance.now();

  // Calibrate blade length to fit from index fingertip down to knuckle
  const fingerDist = Math.hypot(indexTip.x - knucklePt.x, indexTip.y - knucklePt.y);
  const handDist = Math.hypot(indexTip.x - wristPt.x, indexTip.y - wristPt.y);
  playerHand.bladeLen = Math.max(75, Math.min(fingerDist * 1.35, 140));
  playerHand.gripLen = Math.max(45, Math.min(handDist * 0.35, 75));

  if (playerHand.x < 0) {
    playerHand.x = indexTip.x;
    playerHand.y = indexTip.y;
    playerHand.lastX = indexTip.x;
    playerHand.lastY = indexTip.y;
    playerHand.angle = playerHand.targetAngle;
  }
}

// ════════════════════════════════════════════════
//  FRUIT SPAWNING (Calculated Parabolic Arc)
// ════════════════════════════════════════════════
function spawnFruit() {
  const isBomb = Math.random() < CONFIG.bombChance;
  const type = isBomb ? BOMB : FRUIT_TYPES[Math.floor(Math.random() * FRUIT_TYPES.length)];

  const size = isBomb ? 95 : 85 + Math.random() * 25;

  // Spawn along bottom width, comfortably inset from edges
  const margin = Math.max(80, canvas.width * 0.12);
  const x = margin + Math.random() * (canvas.width - margin * 2);
  const y = canvas.height + size * 0.5;

  // Calibrated apex target: between 22% and 42% from top of screen (ideal eye & chest height)
  const targetPeakY = canvas.height * (0.24 + Math.random() * 0.18);
  const riseDistance = y - targetPeakY;

  // Air time to reach apex: ~78 to 92 frames (approx 1.3 to 1.5 seconds)
  const timeToPeak = 78 + Math.random() * 14;

  // Exact kinematic physics:
  // v_peak = 0 => vy_0 = -gravity * timeToPeak
  // distance = 0.5 * gravity * (timeToPeak)^2 => gravity = (2 * riseDistance) / (timeToPeak^2)
  const gravity = (2 * riseDistance) / (timeToPeak * timeToPeak);
  const vy = -gravity * timeToPeak;

  // Gentle inward drift towards center of screen (classic Fruit Ninja cross-cutting arc)
  const screenCenter = canvas.width / 2;
  const driftDirection = (screenCenter - x) / screenCenter; // -1 to +1
  const vx = driftDirection * (1.2 + Math.random() * 1.8);

  fruits.push({
    x, y,
    vx, vy,
    gravity,
    size,
    type,
    isBomb,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.08,
    sliced: false,
    missed: false,
    opacity: 1,
  });
}

// ════════════════════════════════════════════════
//  PARTICLES
// ════════════════════════════════════════════════
function spawnParticles(x, y, color, count = 10) {
  if (particles.length > 70) particles.splice(0, particles.length - 60);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1.0,
      decay: 0.02 + Math.random() * 0.03,
      size: 3 + Math.random() * 6,
      color,
    });
  }
}

function spawnJuiceSplash(x, y, color, count = 6) {
  if (particles.length > 70) particles.splice(0, particles.length - 60);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      life: 1.0,
      decay: 0.015 + Math.random() * 0.02,
      size: 6 + Math.random() * 10,
      color,
      isJuice: true,
    });
  }
}

// Calculate shortest distance from point (px, py) to line segment (x1, y1) -> (x2, y2)
function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const l2 = dx * dx + dy * dy;
  if (l2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

// ════════════════════════════════════════════════
//  SLICE DETECTION (Line-Segment Collision for Fast Motion)
// ════════════════════════════════════════════════
function checkSlices() {
  if (!playerHand.active) return;
  const speed = Math.hypot(playerHand.x - playerHand.lastX, playerHand.y - playerHand.lastY);
  if (speed < 2.5) return; // finger must be moving

  for (let i = fruits.length - 1; i >= 0; i--) {
    const fruit = fruits[i];
    if (fruit.sliced) continue;

    // Check collision against:
    // 1. Knife tip / Fingertip motion trajectory
    // 2. Current blade segment from fingertip to guard
    // 3. Guard motion trajectory
    const dTip = distToSegment(fruit.x, fruit.y, playerHand.lastX, playerHand.lastY, playerHand.x, playerHand.y);
    const dBlade = distToSegment(fruit.x, fruit.y, playerHand.x, playerHand.y, playerHand.baseX, playerHand.baseY);
    const dBase = distToSegment(fruit.x, fruit.y, playerHand.lastBaseX, playerHand.lastBaseY, playerHand.baseX, playerHand.baseY);
    const dist = Math.min(dTip, dBlade, dBase);

    if (dist < CONFIG.sliceRadius + fruit.size * 0.5) {
        fruit.sliced = true;

        if (fruit.isBomb) {
          playBombSound();
          lives--;
          updateLives();
          spawnParticles(fruit.x, fruit.y, '#636e72', 20);
          spawnParticles(fruit.x, fruit.y, '#e17055', 15);
          flashScreen('#ff0000');
          fruits.splice(i, 1);
          if (lives <= 0) endGame();
        } else {
          playSliceSound();
          const now = Date.now();
          if (now - lastSliceTime < CONFIG.comboWindow) {
            comboCount++;
          } else {
            comboCount = 1;
          }
          lastSliceTime = now;

          const points = comboCount >= 3 ? comboCount * 2 : 1;
          score += points;
          totalSliced++;
          scoreEl.textContent = score;

          if (comboCount >= 3) {
            playComboSound(comboCount);
            showCombo(comboCount);
          }

          // Split fruit into two tumbling halves flying outward
          slicedHalves.push({
            x: fruit.x - 10,
            y: fruit.y,
            vx: fruit.vx - 3.5 - Math.random() * 1.5,
            vy: fruit.vy * 0.4 - 1.5,
            gravity: 0.16,
            rotation: fruit.rotation,
            rotSpeed: -0.12,
            size: fruit.size,
            type: fruit.type,
            side: 'left',
            opacity: 1
          });
          slicedHalves.push({
            x: fruit.x + 10,
            y: fruit.y,
            vx: fruit.vx + 3.5 + Math.random() * 1.5,
            vy: fruit.vy * 0.4 - 1.5,
            gravity: 0.16,
            rotation: fruit.rotation,
            rotSpeed: 0.12,
            size: fruit.size,
            type: fruit.type,
            side: 'right',
            opacity: 1
          });

          // Juice & particles
          spawnParticles(fruit.x, fruit.y, fruit.type.color, 14);
          spawnJuiceSplash(fruit.x, fruit.y, fruit.type.juice, 10);

          // Floating score text
          particles.push({
            x: fruit.x, y: fruit.y - 20,
            vx: 0, vy: -1.5,
            life: 1.0, decay: 0.018, size: 0,
            color: '#fff', isText: true, text: `+${points}`,
          });

          // Remove original fruit now that halves exist
          fruits.splice(i, 1);
        }
      }
    }
}

// ════════════════════════════════════════════════
//  COMBO DISPLAY
// ════════════════════════════════════════════════
let comboTimeout = null;

function showCombo(count) {
  comboEl.textContent = `${count}x COMBO!`;
  comboEl.style.transition = 'none';
  comboEl.style.opacity = '1';
  comboEl.style.transform = 'translate(-50%, -50%) scale(0.3)';

  requestAnimationFrame(() => {
    comboEl.style.transition = 'transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.6s';
    comboEl.style.transform = 'translate(-50%, -50%) scale(1)';
  });

  clearTimeout(comboTimeout);
  comboTimeout = setTimeout(() => {
    comboEl.style.opacity = '0';
    comboEl.style.transform = 'translate(-50%, -50%) scale(1.3)';
  }, 600);
}

// ════════════════════════════════════════════════
//  SCREEN FLASH
// ════════════════════════════════════════════════
let flashAlpha = 0;
let flashColor = '#ff0000';

function flashScreen(color) {
  flashColor = color;
  flashAlpha = 0.4;
}

// ════════════════════════════════════════════════
//  HUD
// ════════════════════════════════════════════════
function updateLives() {
  let s = '';
  for (let i = 0; i < CONFIG.maxLives; i++) {
    s += `<span>${i < lives ? '❤️' : '🖤'}</span>`;
  }
  livesEl.innerHTML = s;
}

// ════════════════════════════════════════════════
//  GAME LOOP
// ════════════════════════════════════════════════
let lastTime = 0;

function gameLoop(timestamp) {
  const dt = Math.min(timestamp - lastTime, 50); // cap delta
  lastTime = timestamp;

  // CRITICAL PERFORMANCE FIX:
  // Only resize the canvas when window dimensions actually change!
  // Calling resizeCanvas() 60 times/sec was destroying and re-allocating full-screen GPU textures every frame,
  // causing severe memory thrashing and progressive FPS degradation over time.
  if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // ── 60 FPS Smooth Hand Interpolation ──
  if (playerHand.active) {
    if (performance.now() - playerHand.lastSeenTime > 400) {
      playerHand.active = false;
    } else {
      playerHand.lastX = playerHand.x;
      playerHand.lastY = playerHand.y;
      playerHand.lastBaseX = playerHand.baseX;
      playerHand.lastBaseY = playerHand.baseY;

      const dx = playerHand.targetX - playerHand.x;
      const dy = playerHand.targetY - playerHand.y;
      const dist = Math.hypot(dx, dy);

      // Ultra-responsive follow: Fast swipes lock tightly (0.92), smooth motions glide (0.55)
      const followRate = dist > 25 ? 0.92 : (dist > 8 ? 0.75 : 0.55);
      playerHand.x += dx * followRate;
      playerHand.y += dy * followRate;

      // Smooth angle interpolation
      playerHand.angle = lerpAngle(playerHand.angle, playerHand.targetAngle, 0.42);

      // Knife tip is locked directly to the index fingertip!
      playerHand.tipX = playerHand.x;
      playerHand.tipY = playerHand.y;

      // Base of blade (guard position) extends down towards knuckle
      const bLen = playerHand.bladeLen || 110;
      playerHand.baseX = playerHand.x - Math.sin(playerHand.angle) * bLen;
      playerHand.baseY = playerHand.y + Math.cos(playerHand.angle) * bLen;

      if (playerHand.lastBaseX === undefined || playerHand.lastBaseX < 0) {
        playerHand.lastBaseX = playerHand.baseX;
        playerHand.lastBaseY = playerHand.baseY;
      }

      if (gameState === 'playing' && dist > 1.2) {
        // Golden slash trail emits directly from the knife tip / index fingertip!
        playerHand.trail.push({ x: playerHand.x, y: playerHand.y, age: 1.0 });
        if (playerHand.trail.length > 22) playerHand.trail.shift();
      }
    }
  }

  if (gameState === 'playing') {
    // Difficulty ramp
    const elapsed = (Date.now() - gameStartTime) / 1000;
    const t = Math.min(elapsed / CONFIG.difficultyRampSec, 1);
    currentSpawnInterval = CONFIG.fruitSpawnInterval - t * (CONFIG.fruitSpawnInterval - CONFIG.minSpawnInterval);

    // Spawn
    spawnTimer += dt;
    if (spawnTimer >= currentSpawnInterval) {
      spawnTimer = 0;
      spawnFruit();
      // Sometimes spawn 2 at once at higher difficulty
      if (t > 0.4 && Math.random() < t * 0.4) spawnFruit();
    }

    // Slice detection
    checkSlices();
  }

  // Update & draw fruits
  for (let i = fruits.length - 1; i >= 0; i--) {
    const f = fruits[i];

    if (!f.sliced) {
      f.vy += f.gravity;
      f.x += f.vx;
      f.y += f.vy;
      f.rotation += f.rotSpeed;

      // Missed — fell below screen or drifted far out of bounds
      if (f.y > canvas.height + f.size * 2 || f.x < -300 || f.x > canvas.width + 300) {
        if (!f.isBomb && gameState === 'playing' && f.y > canvas.height) {
          totalMissed++;
          // Lose a life for missing fruit
          lives--;
          updateLives();
          flashScreen('#ff6b6b');
          if (lives <= 0) endGame();
        }
        fruits.splice(i, 1);
        continue;
      }

      // Draw fruit
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rotation);
      ctx.font = `${f.size}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Glow
      ctx.shadowColor = f.type.color;
      ctx.shadowBlur = 10;
      ctx.fillText(f.type.emoji, 0, 0);
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }

  // Update & draw tumbling sliced halves
  for (let i = slicedHalves.length - 1; i >= 0; i--) {
    const h = slicedHalves[i];
    h.vy += h.gravity;
    h.x += h.vx;
    h.y += h.vy;
    h.rotation += h.rotSpeed;
    h.opacity -= 0.022;

    if (h.opacity <= 0 || h.y > canvas.height + 150) {
      slicedHalves.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.globalAlpha = Math.max(0, h.opacity);
    ctx.translate(h.x, h.y);
    ctx.rotate(h.rotation);
    ctx.beginPath();
    if (h.side === 'left') {
      ctx.rect(-h.size, -h.size, h.size, h.size * 2);
    } else {
      ctx.rect(0, -h.size, h.size, h.size * 2);
    }
    ctx.clip();
    ctx.font = `${h.size}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(h.type.emoji, 0, 0);
    ctx.restore();
  }

  // Update & draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08;
    p.life -= p.decay;

    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.globalAlpha = p.life;

    if (p.isText) {
      ctx.font = 'bold 28px Segoe UI, sans-serif';
      ctx.fillStyle = p.color;
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(255,200,0,0.8)';
      ctx.shadowBlur = 12;
      ctx.fillText(p.text, p.x, p.y);
    } else if (p.isJuice) {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.size, p.size * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  // ── Draw Smooth Golden Blade Ribbon & Cursor ──
  if (playerHand.active || playerHand.trail.length > 0) {
    const trail = playerHand.trail;

    // Age & prune trail
    for (let i = 0; i < trail.length; i++) trail[i].age -= CONFIG.trailFadeSpeed;
    while (trail.length > 0 && trail[0].age <= 0) trail.shift();

    if (trail.length > 2) {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // 1. Outer golden aura ribbon (Bezier smoothed)
      ctx.beginPath();
      ctx.moveTo(trail[0].x, trail[0].y);
      for (let i = 1; i < trail.length - 1; i++) {
        const mx = (trail[i].x + trail[i + 1].x) / 2;
        const my = (trail[i].y + trail[i + 1].y) / 2;
        ctx.quadraticCurveTo(trail[i].x, trail[i].y, mx, my);
      }
      ctx.lineTo(trail[trail.length - 1].x, trail[trail.length - 1].y);
      ctx.strokeStyle = 'rgba(255, 215, 0, 0.32)';
      ctx.lineWidth = 22;
      ctx.stroke();

      // 2. Inner white-hot neon blade core (Bezier smoothed)
      ctx.beginPath();
      ctx.moveTo(trail[0].x, trail[0].y);
      for (let i = 1; i < trail.length - 1; i++) {
        const mx = (trail[i].x + trail[i + 1].x) / 2;
        const my = (trail[i].y + trail[i + 1].y) / 2;
        ctx.quadraticCurveTo(trail[i].x, trail[i].y, mx, my);
      }
      ctx.lineTo(trail[trail.length - 1].x, trail[trail.length - 1].y);
      ctx.strokeStyle = '#fffbf0';
      ctx.lineWidth = 8;
      ctx.shadowColor = '#ffd000';
      ctx.shadowBlur = 10;
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // Draw animated katana with tip aligned at the index fingertip
    if (playerHand.active) {
      const knifeSpeed = Math.hypot(playerHand.x - playerHand.lastX, playerHand.y - playerHand.lastY);
      drawKnife(ctx, playerHand.x, playerHand.y, playerHand.angle, knifeSpeed, playerHand.bladeLen, playerHand.gripLen);
    }
  }

  // ── Touchless Hand Gesture Restart ──
  if (gameState === 'over' && !gameOverOv.classList.contains('hidden')) {
    const btnRect = restartBtn.getBoundingClientRect();
    if (btnRect.width > 0) {
      const bx = btnRect.left + btnRect.width / 2;
      const by = btnRect.top + btnRect.height / 2;
      const ringRadius = Math.max(btnRect.width, btnRect.height) * 0.52 + 10;

      let isHovering = false;
      if (playerHand.active) {
        // Can hover with fingertip / knife tip over the restart button
        const distToCenter = Math.hypot(playerHand.x - bx, playerHand.y - by);

        // Direct hover check: fills up smoothly when knife tip is held over button
        if (distToCenter < ringRadius + 18) {
          isHovering = true;
          holdToRestartTimer += dt / 1100; // takes ~1.1s of holding to restart
          if (holdToRestartTimer >= 1.0) {
            holdToRestartTimer = 0;
            playComboSound(5);
            startGame();
            // Do NOT return here — requestAnimationFrame must be called at bottom of gameLoop
          }
        } else {
          // Swipe to restart check: instant trigger if player slashes knife tip through button
          const swipeTip = distToSegment(bx, by, playerHand.lastX, playerHand.lastY, playerHand.x, playerHand.y);
          const swipeBlade = distToSegment(bx, by, playerHand.x, playerHand.y, playerHand.baseX, playerHand.baseY);
          const swipeDist = Math.min(swipeTip, swipeBlade);
          const swipeSpeed = Math.hypot(playerHand.x - playerHand.lastX, playerHand.y - playerHand.lastY);
          if (swipeSpeed > 7 && swipeDist < ringRadius + 18) {
            holdToRestartTimer = 0;
            playSliceSound();
            playComboSound(4);
            startGame();
            // Do NOT return here — requestAnimationFrame must be called at bottom of gameLoop
          }
        }
      }

      if (!isHovering) {
        holdToRestartTimer = Math.max(0, holdToRestartTimer - dt / 350);
      }

      // Draw radial target ring around button
      ctx.save();
      // Outer subtle guide circle
      ctx.beginPath();
      ctx.arc(bx, by, ringRadius, 0, Math.PI * 2);
      ctx.strokeStyle = isHovering ? 'rgba(255, 215, 0, 0.45)' : 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Active filling progress arc
      if (holdToRestartTimer > 0) {
        ctx.beginPath();
        ctx.arc(bx, by, ringRadius, -Math.PI / 2, -Math.PI / 2 + holdToRestartTimer * Math.PI * 2);
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 7;
        ctx.shadowColor = '#ffc107';
        ctx.shadowBlur = 14;
        ctx.stroke();

        const pct = Math.floor(holdToRestartTimer * 100);
        ctx.font = 'bold 15px Segoe UI, sans-serif';
        ctx.fillStyle = '#ffea00';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 8;
        ctx.fillText(`${pct}%`, bx, by + ringRadius + 24);
      }
      ctx.restore();
    }
  }

  // Screen flash effect
  if (flashAlpha > 0) {
    ctx.save();
    ctx.globalAlpha = flashAlpha;
    ctx.fillStyle = flashColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    flashAlpha -= 0.02;
  }

  requestAnimationFrame(gameLoop);
}

// ════════════════════════════════════════════════
//  GAME FLOW
// ════════════════════════════════════════════════
function startGame() {
  initAudio();
  holdToRestartTimer = 0;
  score = 0;
  lives = CONFIG.maxLives;
  fruits = [];
  slicedHalves = [];
  particles = [];
  playerHand.trail = [];
  playerHand.angle = 0;
  playerHand.targetAngle = 0;
  comboCount = 0;
  totalSliced = 0;
  totalMissed = 0;
  spawnTimer = 0;
  currentSpawnInterval = CONFIG.fruitSpawnInterval;
  gameStartTime = Date.now();

  scoreEl.textContent = '0';
  updateLives();

  startOv.classList.add('hidden');
  gameOverOv.classList.add('hidden');
  hud.classList.remove('hidden');

  gameState = 'playing';
}

function endGame() {
  gameState = 'over';
  holdToRestartTimer = 0;

  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('airslasher_best', bestScore);
    bestEl.textContent = bestScore;
  }

  const elapsed = ((Date.now() - gameStartTime) / 1000).toFixed(0);
  finalScoreE.textContent = score;
  finalStats.textContent = `${totalSliced} sliced · ${totalMissed} missed · ${elapsed}s survived`;

  setTimeout(() => {
    gameOverOv.classList.remove('hidden');
  }, 600);
}

// ════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════
startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.textContent = 'Loading...';
  loadSpinner.style.display = 'block';
  loadingText.textContent = 'Starting camera & loading hand model...';

  try {
    setupHands();

    // Wait for the model to be ready (poll a bit)
    let waited = 0;
    while (!handsReady && waited < 15000) {
      await new Promise(r => setTimeout(r, 200));
      waited += 200;
    }

    if (!handsReady) {
      loadingText.textContent = 'Camera access denied or model failed to load. Please allow camera access and refresh.';
      startBtn.textContent = '▶ START GAME';
      startBtn.disabled = false;
      loadSpinner.style.display = 'none';
      return;
    }

    loadingText.textContent = '';
    loadSpinner.style.display = 'none';
    startGame();
  } catch (err) {
    console.error(err);
    loadingText.textContent = `Error: ${err.message}. Please allow camera access.`;
    startBtn.textContent = '▶ START GAME';
    startBtn.disabled = false;
    loadSpinner.style.display = 'none';
  }
});

restartBtn.addEventListener('click', () => {
  initAudio();
  startGame();
});

// Kick off render loop
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
